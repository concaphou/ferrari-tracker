<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ferrari Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ferrari Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --ink:#1B1F23; --muted:#646C74; --line:#D5D9DC;
  --giallo:#F5B800; --giallo-ink:#1B1F23; --blu:#24406B; --good:#2E7D5B; --bad:#9A5B12;
  --cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root{
  --bg:#121416; --surface:#1B1E21; --ink:#E9ECEE; --muted:#9AA2A9; --line:#2C3135;
  --blu:#7FA3D6; --good:#5FC195; --bad:#E0A85A;
}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:18px 16px 48px}
a{color:inherit}
header h1{font:700 2.1rem/1 var(--cond);margin:6px 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.9rem}

/* the one bold element: a timing-board style model strip */
.strip{display:flex;gap:2px;overflow-x:auto;margin:20px -16px 0;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;scroll-snap-align:start;border:0;background:var(--ink);color:var(--bg);
  padding:12px 14px 10px;text-align:left;cursor:pointer;min-width:128px;border-bottom:5px solid transparent}
.strip button:first-child{border-radius:6px 0 0 6px}.strip button:last-child{border-radius:0 6px 6px 0}
.strip button[aria-pressed="true"]{background:var(--giallo);color:var(--giallo-ink);border-bottom-color:var(--ink)}
.strip b{display:block;font:700 1.35rem/1.05 var(--cond);white-space:nowrap}
.strip span{font:500 .95rem/1.2 var(--cond);opacity:.8}
.strip button:focus-visible{outline:3px solid var(--blu);outline-offset:2px}

section{margin-top:30px}
h2{font:600 1.35rem/1.2 var(--cond);margin:0 0 10px}
.note{color:var(--muted);font-size:.85rem;margin:6px 0 0}

.summary{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:18px}
.summary div{background:var(--surface);padding:12px}
.summary .v{font:700 1.6rem/1.1 var(--cond)}
.summary .k{color:var(--muted);font-size:.8rem}
.up{color:var(--bad)}.down{color:var(--good)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
select{font:500 .95rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.chart-box{position:relative;height:240px}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font:600 .82rem var(--body);color:var(--muted)}
tr.year td{font:700 1.1rem var(--cond);border-bottom:2px solid var(--ink);padding-top:16px;background:transparent}
tr.year td span{font:500 .85rem var(--body);color:var(--muted);margin-left:8px}

.cities li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cities{list-style:none;margin:0;padding:0}
.cities .name{font-weight:600}
.cities .pct{font:700 1.2rem var(--cond);text-align:right}
.cities .meta{grid-column:1/-1;color:var(--muted);font-size:.84rem}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:transparent;color:var(--ink);font:500 .9rem var(--body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.cars{list-style:none;margin:0;padding:0}
.cars>li{border-bottom:1px solid var(--line);padding:14px 0}
.photos{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 10px;scrollbar-width:none;border-radius:6px}
.photos::-webkit-scrollbar{display:none}
.photos a{flex:0 0 82%;max-width:340px;aspect-ratio:4/3;scroll-snap-align:start;background:var(--surface);border-radius:6px;overflow:hidden;display:block}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .none{flex:1;aspect-ratio:auto;padding:14px;color:var(--muted);font-size:.85rem;border:1px dashed var(--line);max-width:none}
.info{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.cars .p{font:700 1.25rem var(--cond);text-align:right}
.cars .t{font-weight:600}
.cars .d{color:var(--muted);font-size:.84rem}
.cars .drop{color:var(--good);font-size:.84rem;text-align:right}
.cars .bad{color:var(--bad)}
.go{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.go a{text-decoration:none;font:600 .9rem var(--body);padding:8px 12px;border-radius:6px;background:var(--ink);color:var(--bg)}
.go a:first-child{background:var(--giallo);color:var(--giallo-ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;background:var(--giallo)}
.legend i.nat{background:none;border-top:2px dashed var(--muted);height:0}
.legend i.bar{height:10px;width:10px;background:var(--blu);opacity:.4}
.empty{padding:24px;text-align:center;color:var(--muted)}
button.more{margin-top:10px;width:100%;padding:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font:500 .95rem var(--body)}
@media (max-width:420px){.summary{grid-template-columns:1fr 1fr}.summary div:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Ferrari Tracker</h1>
    <p id="updated">Loading…</p>
  </header>

  <nav class="strip" id="strip" aria-label="Model"></nav>

  <div id="content"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const money = v => v == null ? "—" : "$" + Math.round(v).toLocaleString("en-US");
const kmoney = v => v == null ? "—" : "$" + (v / 1000).toFixed(v >= 1e6 ? 0 : 1).replace(/\.0$/, "") + "k";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA, current, chart, cityScope = "model", listLimit = 25;

function pickModel() {
  try { const m = localStorage.getItem("model"); if (m && DATA.by_model[m]) return m; } catch (e) {}
  return DATA.models[0];
}

async function init() {
  try {
    const r = await fetch("data.json?t=" + Date.now());
    DATA = await r.json();
  } catch (e) {
    $("#updated").textContent = "Couldn't load data.json. Check that the scraper has run at least once.";
    return;
  }
  if (DATA.empty) {
    $("#updated").textContent = "No data yet. Results appear after the first scheduled run (11am or 5pm Central).";
    return;
  }
  const t = new Date(DATA.latest_time);
  $("#updated").textContent = `Updated ${t.toLocaleString("en-US", {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone:"America/Chicago"})} CT · ${DATA.snapshot_count} snapshots since ${new Date(DATA.first_time).toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
  current = pickModel();
  renderStrip();
  render();
}

function renderStrip() {
  $("#strip").innerHTML = DATA.models.map(m => {
    const c = DATA.by_model[m].current;
    return `<button aria-pressed="${m === current}" data-m="${esc(m)}"><b>${esc(m)}</b><span>${c.listed} listed · ${kmoney(c.med)}</span></button>`;
  }).join("");
  $("#strip").querySelectorAll("button").forEach(b => b.onclick = () => {
    current = b.dataset.m; listLimit = 25;
    try { localStorage.setItem("model", current); } catch (e) {}
    renderStrip(); render();
  });
}

function render() {
  const M = DATA.by_model[current], c = M.current;
  const countDelta = c.prev_listed == null ? "" : (c.listed - c.prev_listed === 0 ? "no change" : `${c.listed - c.prev_listed > 0 ? "+" : ""}${c.listed - c.prev_listed} since last run`);
  const ch = c.change_7d;
  $("#content").innerHTML = `
    <div class="summary">
      <div><div class="v">${money(c.med)}</div><div class="k">Median asking price${ch == null ? "" : ` · <span class="${ch > 0 ? "up" : "down"}">${ch > 0 ? "+" : ""}${ch}% vs 7 days ago</span>`}</div></div>
      <div><div class="v">${c.listed}</div><div class="k">Listed now${countDelta ? " · " + countDelta : ""}</div></div>
      <div><div class="v">${kmoney(c.low)}</div><div class="k">Lowest ask</div></div>
    </div>

    <section>
      <div class="panel">
        <div class="chart-head">
          <h2 style="margin:0">Price and availability</h2>
          <div class="filters">
            <select id="yearSel" aria-label="Model year">
              <option value="All">All years</option>
              ${[...new Set(M.cars.map(c => c[0]).filter(Boolean))].sort((a,b) => b-a).map(y => `<option value="${y}">${y}</option>`).join("")}
            </select>
            <select id="citySel" aria-label="City">
              <option value="All">All cities</option>
              ${M.cities_now.map(([c, n]) => `<option value="${esc(c)}">${esc(c)} (${n})</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="chart-box"><canvas id="trend"></canvas></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <section>
      <h2>Prices by year and exterior color</h2>
      ${priceTable(M)}
      <p class="note">Current listings only. Red and near-red exteriors or interiors are excluded.</p>
    </section>

    <section>
      <h2>Where prices are lowest</h2>
      <div class="seg" role="group" aria-label="City ranking scope">
        <button data-s="model" aria-pressed="${cityScope === "model"}">${esc(current)}</button>
        <button data-s="all" aria-pressed="${cityScope === "all"}">All six models</button>
      </div>
      <ul class="cities" id="cities"></ul>
      <p class="note">Each car is compared with the same model and year listed at the same time, adjusted for mileage. "Below market" counts the snapshots where that city's cars averaged under market. Last ${DATA.city_window_days} days.</p>
    </section>

    <section>
      <h2>Listed now</h2>
      <ul class="cars" id="cars"></ul>
    </section>`;

  const redraw = () => drawChart(M, $("#yearSel").value, $("#citySel").value);
  $("#yearSel").onchange = redraw;
  $("#citySel").onchange = redraw;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    cityScope = b.dataset.s;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderCities();
  });
  redraw();
  renderCities();
  renderCars();
}

function priceTable(M) {
  if (!M.price_table.length) return `<div class="panel empty">No ${esc(current)} listings in the latest snapshot.</div>`;
  let html = `<div class="panel scroll"><table><thead><tr><th>Exterior</th><th>Listed</th><th>Low</th><th>Avg</th><th>High</th></tr></thead><tbody>`;
  for (const y of M.years) {
    html += `<tr class="year"><td colspan="5">${y.year}<span>${y.listed} cars · avg ${money(y.avg)}</span></td></tr>`;
    for (const r of M.price_table.filter(r => r.year === y.year)) {
      html += `<tr><td>${esc(r.color)}</td><td>${r.listed}</td><td>${kmoney(r.low)}</td><td>${kmoney(r.avg)}</td><td>${kmoney(r.high)}</td></tr>`;
    }
  }
  return html + "</tbody></table></div>";
}

function renderCities() {
  const list = cityScope === "all" ? DATA.cities : DATA.by_model[current].cities;
  const el = $("#cities");
  if (!list.length) { el.innerHTML = `<li class="empty" style="display:block">Not enough history yet. Cities appear once they have ${cityScope === "all" ? "3" : "2"}+ cars.</li>`; return; }
  el.innerHTML = list.slice(0, 15).map(c => {
    const pct = c.vs_market, share = c.snaps_present ? Math.round(100 * c.snaps_below / c.snaps_present) : 0;
    const models = cityScope === "all" ? " · " + Object.entries(c.models).map(([m, n]) => `${m} ${n}`).join(", ") : "";
    return `<li><span class="name">${esc(c.city)}</span>
      <span class="pct ${pct < 0 ? "down" : "up"}">${pct > 0 ? "+" : ""}${pct}%</span>
      <span class="bar"><i style="width:${share}%"></i></span>
      <span class="meta">${c.cars} cars · below market in ${c.snaps_below} of ${c.snaps_present} snapshots${models}</span></li>`;
  }).join("");
}

function renderCars() {
  const L = DATA.by_model[current].listings, el = $("#cars");
  if (!L.length) { el.innerHTML = `<li class="empty">No cars listed right now.</li>`; return; }
  el.innerHTML = L.slice(0, listLimit).map(c => {
    const main = c.links[0] ? c.links[0].u : "";
    const photos = (c.photos || []).length
      ? c.photos.map((u, k) => `<a href="${esc(main)}" target="_blank" rel="noopener" aria-label="Photo ${k + 1} of ${c.photos.length}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>`).join("")
      : `<a class="none" href="${esc(main)}" target="_blank" rel="noopener">No photos captured yet. They're added as the scraper visits each listing.</a>`;
    const links = c.links.map(l => `<a href="${esc(l.u)}" target="_blank" rel="noopener">View on ${esc(l.s)}</a>`).join("");
    return `<li>
      <div class="photos">${photos}</div>
      <div class="info">
        <span class="t">${c.year ?? ""} · ${esc(c.ext)} / ${esc(c.int)}</span>
        <span class="p">${money(c.price)}</span>
        <span class="d">${c.miles != null ? c.miles.toLocaleString() + " mi · " : ""}${esc(c.city)} · ${esc(c.dealer)}</span>
        <span class="drop ${c.drop > 0 ? "bad" : ""}">${c.drop < 0 ? "Down " + kmoney(-c.drop) : c.drop > 0 ? "Up " + kmoney(c.drop) : ""}</span>
        <span class="d">${c.days ? `Listed ${c.days} days` : "New this week"}${c.photos && c.photos.length > 1 ? ` · ${c.photos.length} photos, swipe to see more` : ""}</span>
      </div>
      ${links ? `<div class="go">${links}</div>` : ""}
    </li>`;
  }).join("");
  el.querySelectorAll(".photos img").forEach(img => img.addEventListener("error", () => {
    const strip = img.closest(".photos"); img.parentElement.remove();
    if (strip && !strip.children.length) strip.remove();
  }));
  if (L.length > listLimit) {
    el.insertAdjacentHTML("afterend", `<button class="more" id="more">Show all ${L.length}</button>`);
    $("#more").onclick = e => { listLimit = 1e9; e.target.remove(); renderCars(); };
  }
}

function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function series(M, year, city) {
  const n = DATA.snaps.length, count = new Array(n).fill(0), prices = Array.from({length: n}, () => []);
  for (const [y, c, segs] of M.cars) {
    if (year !== "All" && String(y) !== year) continue;
    if (city !== "All" && c !== city) continue;
    for (const [a, b, p] of segs) for (let i = a; i <= b; i++) { count[i]++; if (p) prices[i].push(p); }
  }
  return {count, med: prices.map(median)};
}

function drawChart(M, year, city) {
  if (chart) chart.destroy();
  const box = $("#trend");
  if (typeof Chart === "undefined") { box.parentElement.innerHTML = `<p class="empty">Chart library didn't load. Check your connection.</p>`; return; }
  const css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
  const ink = v("--muted"), line = v("--line");
  const sel = series(M, year, city), nat = city === "All" ? null : series(M, year, "All");
  const where = city === "All" ? "All cities" : city;
  const sets = [
    {type: "line", label: where + " median", data: sel.med, yAxisID: "y", borderColor: v("--giallo"), backgroundColor: v("--giallo"), borderWidth: 3, pointRadius: city === "All" ? 0 : 2, tension: .25, spanGaps: true, order: 1},
    {type: "bar", label: "Listed", data: sel.count, yAxisID: "y2", backgroundColor: v("--blu") + "55", borderRadius: 2, order: 3}
  ];
  if (nat) sets.splice(1, 0, {type: "line", label: "All cities median", data: nat.med, yAxisID: "y", borderColor: ink, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, tension: .25, spanGaps: true, order: 2});
  $("#legend").innerHTML = `<span><i></i>${esc(where)} median price</span>${nat ? `<span><i class="nat"></i>All cities median</span>` : ""}<span><i class="bar"></i>Cars listed${city === "All" ? "" : " in " + esc(city)}</span>`;
  chart = new Chart(box, {
    data: {labels: DATA.snaps, datasets: sets},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: {mode: "index", intersect: false},
      plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => c.dataset.yAxisID === "y" ? `${c.dataset.label}: ${money(c.raw)}` : `${c.raw} listed`}}},
      scales: {
        x: {ticks: {color: ink, maxTicksLimit: 5, maxRotation: 0}, grid: {display: false}},
        y: {position: "left", ticks: {color: ink, callback: v => kmoney(v), maxTicksLimit: 5}, grid: {color: line}},
        y2: {position: "right", beginAtZero: true, ticks: {color: ink, precision: 0, maxTicksLimit: 5}, grid: {display: false}}
      }
    }
  });
}

init();
</script>
</body>
</html>
